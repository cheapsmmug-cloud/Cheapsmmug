    <style>
        /* ==========================================
           CHEAPSMMUG CLEAN SaaS REGISTRATION STYLES
           ========================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #08164A; /* Deep navy foundation */
            font-family: 'Inter', sans-serif;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: #FFFFFF; /* Clean white card */
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-radius: 8px; /* Subtle, professional radius */
            box-sizing: border-box;
        }

        /* Brand Header */
        .register-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .register-brand h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #111827; /* Black */
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .register-brand h1 span {
            color: #2563EB; /* Blue */
        }
        .register-brand p {
            font-size: 0.95rem;
            color: #64748B;
            margin: 0;
        }

        /* Form Overrides for Registration Card */
        .auth__form .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .auth__form .form-label {
            color: #111827;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
        }

        .auth__form .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .auth__form .form-input {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            color: #111827;
            border-radius: 4px; /* Sharp inputs */
            padding: 12px 14px;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .auth__form .form-input:focus {
            outline: none;
            border-color: #2563EB; /* Blue focus state */
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .auth__form .form-input::placeholder {
            color: #9CA3AF;
        }

        .auth__form .input-wrapper {
            position: relative;
            width: 100%;
        }
        .auth__form .input-action {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #64748B;
            cursor: pointer;
            padding: 4px;
        }

        /* Terms Checkbox */
        .auth__form .form-options {
            margin-bottom: 24px;
        }
        .auth__form .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Force native checkbox to be visible and styled cleanly */
        .auth__form .form-checkbox {
            appearance: auto !important;
            -webkit-appearance: auto !important;
            width: 16px !important;
            height: 16px !important;
            margin: 0 !important;
            cursor: pointer;
            accent-color: #2563EB; /* Blue tick */
            position: relative !important;
            opacity: 1 !important;
        }

        .auth__form .checkbox-label {
            color: #64748B;
            font-size: 0.85rem;
        }
        .auth__form .form-link {
            color: #2563EB; /* Blue links */
            font-weight: 600;
            text-decoration: none;
        }
        .auth__form .form-link:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .auth__form .btn--primary {
            width: 100%;
            background: #2563EB; /* Solid Blue Button */
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .auth__form .btn--primary:hover {
            background: #1d4ed8; /* Darker blue on hover */
        }

        .auth__form .btn--outline {
            width: 100%;
            background: #FFFFFF;
            color: #111827;
            border: 1px solid #E5E7EB;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .auth__form .btn--outline:hover {
            background: #F8FAFC;
        }

        /* Divider */
        .auth__divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
            color: #64748B;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .auth__divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #E5E7EB;
            z-index: 1;
        }
        .auth__divider span {
            background: #FFFFFF;
            padding: 0 12px;
            position: relative;
            z-index: 2;
        }

        /* Footer */
        .auth__footer {
            text-align: center;
            margin-top: 24px;
            color: #64748B;
            font-size: 0.9rem;
        }
        .auth__footer p {
            margin: 0;
        }

        /* ==========================================
           RESPONSIVE STYLES
           ========================================== */
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: flex-start;
            }
            .register-container {
                max-width: 100%;
                padding: 24px;
                border-radius: 0; /* Full width on mobile */
                min-height: 100vh;
                box-shadow: none;
            }
            .register-brand h1 {
                font-size: 1.6rem;
            }
        }
    </style>

<body>

    <div class="register-container">
        
        <!-- ==========================================
             BRAND HEADER
             ========================================== -->
        <div class="register-brand">
            <h1>CHEAP<span>SMMUG</span></h1>
            <p>Create your account and get started today</p>
        </div>

        <!-- ==========================================
             REGISTRATION FORM (Preserved IDs/Logic)
             ========================================== -->
        <form class="auth__form" id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" id="fullname" class="form-input" placeholder="John Mathew" required>
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="john@example.com" oninput="this.value = this.value.toLowerCase();" required>
            </div>
            
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="john123" oninput="this.value = this.value.toLowerCase();" required>
            </div>
            
            <div class="form-group">
                <label for="country" class="form-label">Country</label>
                <input type="text" id="country" class="form-input" placeholder="e.g., Uganda" required>
            </div>
            
            <div class="form-group">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" id="phone" class="form-input" placeholder="+2567XXXXXXXX" required>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label for="password" class="form-label">Password</label>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" oninput="this.value = this.value.toLowerCase();" required>
                    <button type="button" class="input-action" aria-label="Toggle Password Visibility" onclick="togglePasswordVisibility(this)">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" class="form-checkbox" required>
                    <span class="checkbox-label">I agree to the <a href="#" class="form-link">Terms & Conditions</a></span>
                </label>
            </div>

            <button type="submit" class="btn btn--primary btn--block">Create Account</button>
            
            <div class="auth__divider"><span>OR</span></div>
            
            <button type="button" id="google-login-btn" class="btn btn--outline btn--block">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span>Continue with Google</span>
            </button>
            
            <div class="auth__footer">
                <p>Already have an account? <a href="login.html" class="form-link">Sign in</a></p>
            </div>
        </form>
        
    </div>

    <!-- Scripts (Preserved exactly) -->
    <script>
        function togglePasswordVisibility(btn) {
            const input = btn.parentElement.querySelector('input');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
    
    <!-- Google Identity Services Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="assets/js/app.js"></script>
</body>
