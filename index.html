<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="_4VcrmvY2S8GSdic0AMrBR1BlTx5-5-dA4GR_ZXe2TU" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEAPSMMUG | Loading...</title>
    
    <!-- Redirect to dashboard -->
    <meta http-equiv="refresh" content="1; url=dashboard.html">
    
    <!-- Google Fonts: Inter & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #F8FAFC; /* Clean SaaS off-white background */
            color: #111827;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px; /* Prevents edge touching on mobile */
            animation: fadeIn 0.5s ease-in;
        }
        
        /* Text Logo Styling */
        .logo {
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
            text-align: center;
            font-family: 'Manrope', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #111827; /* Black */
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }
        .logo span {
            color: #2563EB; /* Blue */
        }

        /* Spinner Styling */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E5E7EB; /* Light gray track */
            border-top-color: #2563EB; /* SaaS Blue spinner */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            font-size: 14px;
            color: #64748B; /* Muted gray text */
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===============================================
           MOBILE RESPONSIVENESS
           =============================================== */
        @media (max-width: 768px) {
            .logo {
                font-size: 1.8rem;
            }
            .spinner {
                width: 45px;
                height: 45px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.6rem;
                margin-bottom: 30px;
            }
            .spinner {
                width: 40px;
                height: 40px;
                border-width: 3px;
            }
            .loading-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    
    <a href="dashboard.html" class="logo">
        CHEAP<span>SMMUG</span>
    </a>

    <div class="spinner-container">
        <div class="spinner"></div>
        <p class="loading-text">Preparing your dashboard...</p>
    </div>

    <!-- Fallback redirect if meta refresh fails -->
    <script>
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1000);
    </script>
</body>
</html>
